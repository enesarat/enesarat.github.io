<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hapşu</title>
<meta name="description" content="Hapşu: Planla & Hatırla — ilaç planlama ve hatırlatma uygulaması.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg:#f6f8f8; --card:#ffffff; --text:#14201f; --muted:#5b6b69; --accent:#1f9d8f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1514; --card:#18211f; --text:#e8efee; --muted:#9aaba8; --accent:#3cc4b4; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:24px 16px; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:440px; width:100%; background:var(--card); border-radius:24px;
         padding:40px 28px; text-align:center; }
  .icon { width:96px; height:96px; border-radius:22px; }
  h1 { margin:20px 0 4px; font-size:28px; }
  .tag { margin:0 0 20px; color:var(--accent); font-weight:600; }
  p { color:var(--muted); line-height:1.55; margin:0 0 12px; }
  .stores { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:20px; }
  .stores a { display:block; line-height:0; border-radius:8px; transition:transform .15s; }
  .stores a:hover { transform:translateY(-2px); }
  .stores img { height:48px; width:auto; }
  footer { margin-top:28px; font-size:13px; color:var(--muted); }
  footer a { color:var(--muted); }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="Hapşu">
  <h1>Hapşu</h1>
  <p class="tag">Planla &amp; Hatırla</p>
  <p>İlaçlarınızı planlayın, dozlarınızı zamanında hatırlayın, yakınlarınızla birlikte takip edin.</p>
  <p lang="en">Plan your medications, never miss a dose, and keep your loved ones in the loop.</p>
  <div class="stores">
    <a href="https://apps.apple.com/tr/app/hapsu-pill-reminder/id6761936573"><img src="badge-appstore-tr.svg" alt="App Store'dan İndirin"></a>
    <a href="https://play.google.com/store/apps/details?id=com.arat.hapsu"><img src="badge-googleplay-tr.png" alt="Google Play'den İndirin"></a>
  </div>
  <footer>İletişim / Contact: <a href="mailto:artcodens@gmail.com">artcodens@gmail.com</a><br>
    <a href="privacy/">Gizlilik Politikası</a> · <a href="privacy/en/">Privacy Policy</a></footer>
</main>
</body>
</html>
